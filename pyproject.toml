[build-system]
requires = ["setuptools>=77"]  # SPDX license expression (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "zt-memory"
version = "0.4.0"
description = "Local, low-token context engine for code LLMs: symbol-level hybrid retrieval with an edit-energy prior, for consumer GPUs and MCP clients"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Gioacchino Tortorici" }]
readme = "README.md"
keywords = ["llm", "mcp", "code-search", "rag", "llama.cpp", "bedrock", "air-gapped", "tree-sitter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/Giotor84/zt-memory"
Issues = "https://github.com/Giotor84/zt-memory/issues"

[project.scripts]
zt = "zt_memory.cli:main"
zt-sync = "zt_memory.cli:sync_main"

[project.optional-dependencies]
hnsw = ["hnswlib>=0.8"]
treesitter = [
    "tree-sitter>=0.23", "tree-sitter-python>=0.23", "tree-sitter-javascript>=0.23", "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23", "tree-sitter-rust>=0.23", "tree-sitter-java>=0.23", "tree-sitter-c>=0.23", "tree-sitter-cpp>=0.23",
]
hf = ["transformers>=4.51"]  # >=4.51 required by Qwen3 ("qwen3" model_type)
monitor = ["psutil>=5.9"]
bedrock = ["boto3>=1.34"]  # [engine] backend = "bedrock" (Amazon Bedrock Converse API)
# hnswlib ships no Windows wheels (needs MSVC to build): optional there, the exact scan index is the default anyway
dev = ["pytest>=8", "hnswlib>=0.8; sys_platform != 'win32'", "psutil>=5.9", "zt-memory[treesitter]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
